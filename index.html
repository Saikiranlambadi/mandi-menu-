<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sash Mandi Darbar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <header class="top">
      <div class="logo">SASH <span>MANDI DARBAR</span></div>

      <button class="menu-btn" id="menuBtn" aria-label="Open menu">⋮</button>
    </header>

    <!-- Category Dropdown -->
    <div class="menu-dropdown" id="menuDropdown">
      <div class="menu-dropdown-title">BROWSE MENU</div>
      <ul class="menu-links">
        <li><a href="#" data-filter="fry">🍗 Chicken Fry Mandi</a></li>
        <li><a href="#" data-filter="broasted">🍖 Chicken Broasted</a></li>
        <li><a href="#" data-filter="mutton">🐑 Mutton Mandi</a></li>
        <li><a href="#" data-filter="fish">🐟 Fish Mandi</a></li>
        <li><a href="#" data-filter="juice">🥤 Drinks &amp; Juices</a></li>
        <li><a href="#" data-filter="extras">🍚 Extras</a></li>
        <li><a href="#" data-filter="shawarma">🌯 Shawarma</a></li>
        <li><a href="#" data-filter="dessert">🍮 Desserts</a></li>
      </ul>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>

    <section class="slider" id="slider" aria-label="Restaurant menu">
      <!-- Slides are generated by script.js -->
    </section>

    <div class="bottom">
      <div class="dots" id="dots"></div>
      <div class="counter" id="counter">01 / 22</div>
    </div>
  </main>
  <!-- Promo notification -->
  <div class="promo-toast" id="promoToast">
    <button class="promo-close" id="promoClose" aria-label="Close">&times;</button>
    <div class="promo-badge">🔥 LIMITED TIME</div>
    <div class="promo-content">
      <img src="images/double_ka_meetha.jpg" alt="Double Ka Meetha" class="promo-img">
      <div class="promo-info">
        <div class="promo-name">Double Ka Meetha</div>
        <div class="promo-desc">Classic Hyderabadi bread pudding</div>
        <div class="promo-prices">
          <span class="promo-old">₹120</span>
          <span class="promo-new">₹80</span>
        </div>
      </div>
    </div>
    <div class="promo-footer">Special offer today only! 🎉</div>
  </div>

  <script src="script.js"></script>
</body>

</html>
